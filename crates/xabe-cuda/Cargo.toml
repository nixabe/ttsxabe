[package]
name = "xabe-cuda"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
cudarc.workspace = true
half.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
half.workspace = true
xabe-dsp.workspace = true
# For `tests/quant.rs` only: the packed matmul is a second transcription of
# the block layouts and is compared against the container crate's decoder,
# which is the one checked against `gguf-py`. Not a runtime edge - the crate
# map has `xabe-cuda` depending on `xabe-dsp` alone.
xabe-gguf.workspace = true

[[bin]]
name = "bench-gemm"
path = "src/bin/bench_gemm.rs"
