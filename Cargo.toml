[workspace]
resolver = "3"
members = [
    "crates/xabe-st",
    "crates/xabe-golden",
    "crates/xabe-vits",
    "crates/xabe-dsp",
    "crates/xabe-cuda",
    "crates/xabe-tts",
    "crates/xabe-audio",
    "crates/xabe-engine",
    "crates/xabe-serve",
    "crates/xabe-vad",
    "crates/xabe-whisper",
    "crates/xabe-asr",
    "crates/xabe-llama",
    "crates/xabe-gguf",
    "crates/xabe-chat",
    "crates/xabe-cosy",
    "crates/xabe-translate",
    "crates/xabe-taco",
    "crates/xabe-pt",
    "crates/xabe-taigi",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/nixabe/ttsxabe"
authors = ["ttsxabe contributors"]

[workspace.dependencies]
xabe-st = { path = "crates/xabe-st" }
xabe-vits = { path = "crates/xabe-vits" }
xabe-dsp = { path = "crates/xabe-dsp" }
xabe-golden = { path = "crates/xabe-golden" }
xabe-cuda = { path = "crates/xabe-cuda" }
xabe-tts = { path = "crates/xabe-tts" }
xabe-audio = { path = "crates/xabe-audio" }
xabe-serve = { path = "crates/xabe-serve" }
xabe-vad = { path = "crates/xabe-vad" }
xabe-whisper = { path = "crates/xabe-whisper" }
xabe-taco = { path = "crates/xabe-taco" }
xabe-asr = { path = "crates/xabe-asr" }
xabe-llama = { path = "crates/xabe-llama" }
xabe-gguf = { path = "crates/xabe-gguf" }
xabe-pt = { path = "crates/xabe-pt" }
xabe-taigi = { path = "crates/xabe-taigi" }
xabe-chat = { path = "crates/xabe-chat" }
xabe-cosy = { path = "crates/xabe-cosy" }
xabe-translate = { path = "crates/xabe-translate" }

clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
memmap2 = "0.9"
half = "2"
rustc-hash = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"

# The serving surface. Taken as a set from `llmxabe/crates/xabe-server`, which
# already runs this stack against the same card, rather than re-argued here.
# `tokio`'s features are hand-picked rather than `full`: the engine drives GPU
# work on its own threads and needs the executor for sockets, not for compute.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws", "multipart", "query"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
async-stream = "0.3"
base64 = "0.22"
# HTTP client for `--<stage>-url`. `llmxabe` has no client at all, so this is
# the one dependency in the set with no precedent there. Default features are
# off deliberately: every URL the engine dials is another process on this host,
# reached over plain HTTP, so a TLS stack would be weight with no user.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream"] }
# `fallback-dynamic-loading` is what keeps CUDA out of the build: the workspace
# compiles and its non-GPU tests run on a machine with no toolkit and no card.
# GPU-ness is a runtime skip, not a compile-time cfg.
cudarc = { version = "0.19", default-features = false, features = ["std", "cuda-12040", "driver", "nvrtc", "fallback-dynamic-loading"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

# The differential harness runs the whole reference forward pass thousands of
# times; a plain debug build makes that a coffee break rather than a test run.
[profile.dev.package."*"]
opt-level = 2
