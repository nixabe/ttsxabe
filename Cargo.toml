[workspace]
resolver = "3"
members = [
    "crates/llmtie-st",
    "crates/llmtie-golden",
    "crates/llmtie-vits",
    "crates/llmtie-dsp",
    "crates/llmtie-cuda",
    "crates/llmtie-tts",
    "crates/llmtie-audio",
    "crates/llmtie-engine",
    "crates/llmtie-serve",
    "crates/llmtie-vad",
    "crates/llmtie-whisper",
    "crates/llmtie-asr",
    "crates/llmtie-llama",
    "crates/llmtie-gguf",
    "crates/llmtie-chat",
    "crates/llmtie-cosy",
    "crates/llmtie-translate",
    "crates/llmtie-taco",
    "crates/llmtie-pt",
    "crates/llmtie-taigi",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/nixabe/llmtie-rs"
authors = ["llmtie-rs contributors"]

[workspace.dependencies]
llmtie-st = { path = "crates/llmtie-st" }
llmtie-vits = { path = "crates/llmtie-vits" }
llmtie-dsp = { path = "crates/llmtie-dsp" }
llmtie-golden = { path = "crates/llmtie-golden" }
llmtie-cuda = { path = "crates/llmtie-cuda" }
llmtie-tts = { path = "crates/llmtie-tts" }
llmtie-audio = { path = "crates/llmtie-audio" }
llmtie-serve = { path = "crates/llmtie-serve" }
llmtie-vad = { path = "crates/llmtie-vad" }
llmtie-whisper = { path = "crates/llmtie-whisper" }
llmtie-taco = { path = "crates/llmtie-taco" }
llmtie-asr = { path = "crates/llmtie-asr" }
llmtie-llama = { path = "crates/llmtie-llama" }
llmtie-gguf = { path = "crates/llmtie-gguf" }
llmtie-pt = { path = "crates/llmtie-pt" }
llmtie-taigi = { path = "crates/llmtie-taigi" }
llmtie-chat = { path = "crates/llmtie-chat" }
llmtie-cosy = { path = "crates/llmtie-cosy" }
llmtie-translate = { path = "crates/llmtie-translate" }

clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
memmap2 = "0.9"
half = "2"
rustc-hash = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"

# The serving surface. Taken as a set from `llmxabe/crates/xabe-server`, which
# already runs this stack against the same card, rather than re-argued here.
# `tokio`'s features are hand-picked rather than `full`: the engine drives GPU
# work on its own threads and needs the executor for sockets, not for compute.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws", "multipart", "query"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
async-stream = "0.3"
base64 = "0.22"
# HTTP client for `--<stage>-url`. `llmxabe` has no client at all, so this is
# the one dependency in the set with no precedent there. Default features are
# off deliberately: every URL the engine dials is another process on this host,
# reached over plain HTTP, so a TLS stack would be weight with no user.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream"] }
# `fallback-dynamic-loading` is what keeps CUDA out of the build: the workspace
# compiles and its non-GPU tests run on a machine with no toolkit and no card.
# GPU-ness is a runtime skip, not a compile-time cfg.
cudarc = { version = "0.19", default-features = false, features = ["std", "cuda-12040", "driver", "nvrtc", "fallback-dynamic-loading"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

# The differential harness runs the whole reference forward pass thousands of
# times; a plain debug build makes that a coffee break rather than a test run.
[profile.dev.package."*"]
opt-level = 2
